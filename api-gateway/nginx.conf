events {}

http {
    # On AWS ECS all containers run in one task and share localhost.
    upstream auth_service {
        server 127.0.0.1:5001;
    }

    upstream restaurant_service {
        server 127.0.0.1:5002;
    }

    upstream order_service {
        server 127.0.0.1:5003;
    }

    upstream delivery_service {
        server 127.0.0.1:5004;
    }

    upstream customer_service {
        server 127.0.0.1:5005;
    }

    server {
        listen 80;
        server_name localhost;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        # Allow Swagger docs over plain HTTP origins by suppressing strict isolation headers.
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Origin-Agent-Cluster;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = / {
            return 200 "API Gateway is running\n";
            add_header Content-Type text/plain;
        }

        location = /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /api/auth {
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/restaurants {
            proxy_pass http://restaurant_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/orders {
            proxy_pass http://order_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/deliveries {
            proxy_pass http://delivery_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/customers {
            proxy_pass http://customer_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/docs/auth/ {
            proxy_pass http://auth_service/api/docs/;
        }

        location /api/docs/restaurants/ {
            proxy_pass http://restaurant_service/api/docs/;
        }

        location /api/docs/orders/ {
            proxy_pass http://order_service/api/docs/;
        }

        location /api/docs/deliveries/ {
            proxy_pass http://delivery_service/api/docs/;
        }

        location /api/docs/customers/ {
            proxy_pass http://customer_service/api/docs/;
        }

        location = /api/health/auth {
            proxy_pass http://auth_service/health;
        }

        location = /api/health/restaurant {
            proxy_pass http://restaurant_service/health;
        }

        location = /api/health/order {
            proxy_pass http://order_service/health;
        }

        location = /api/health/delivery {
            proxy_pass http://delivery_service/health;
        }

        location = /api/health/customer {
            proxy_pass http://customer_service/health;
        }

        location = /api/db-check/auth {
            proxy_pass http://auth_service/db-check;
        }

        location = /api/db-check/restaurant {
            proxy_pass http://restaurant_service/db-check;
        }

        location = /api/db-check/order {
            proxy_pass http://order_service/db-check;
        }

        location = /api/db-check/delivery {
            proxy_pass http://delivery_service/db-check;
        }

        location = /api/db-check/customer {
            proxy_pass http://customer_service/db-check;
        }
    }
}
