
name: Deploy Food Delivery Microservices to AWS

on:
  workflow_dispatch:
    inputs:
      deploy_ecs:
        description: "Redeploy ECS service after pushing images"
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AWS_ACCOUNT_ID: "886312446090"
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: food-delivery-cluster
  ECS_SERVICE: food-delivery-service
  ECR_PREFIX: food-delivery

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Step 1: Checkout GitHub repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Validate AWS configuration
      - name: Validate configuration
        shell: bash
        run: |
          if [ -z "$AWS_REGION" ]; then
            echo "::error::Set AWS_REGION in GitHub Actions variables."
            exit 1
          fi

          echo "AWS Region: $AWS_REGION"
          echo "AWS Account: $AWS_ACCOUNT_ID"
          echo "ECS Cluster: $ECS_CLUSTER"
          echo "ECS Service: $ECS_SERVICE"

      # Step 3: Authenticate using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::886312446090:role/github-actions-ecs-deployer
          role-session-name: GitHubActionsDeployment
          aws-region: ${{ env.AWS_REGION }}

      # Step 4: Verify AWS identity
      - name: Verify AWS authentication
        run: |
          aws sts get-caller-identity

      # Step 5: Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Step 6: Check ECR repositories
      - name: Verify ECR repositories
        shell: bash
        run: |
          SERVICES=(
            api-gateway
            auth-service
            restaurant-service
            order-service
            delivery-service
            customer-service
          )

          for SERVICE in "${SERVICES[@]}"; do
            REPO="$ECR_PREFIX/$SERVICE"

            echo "Checking repository: $REPO"

            aws ecr describe-repositories \
              --repository-names "$REPO" \
              --region "$AWS_REGION" > /dev/null
          done

          echo "All ECR repositories exist."

      # Step 7: Build and push six Docker images
      - name: Build and push Docker images
        shell: bash
        run: |
          set -euo pipefail

          REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          IMAGE_TAG="${GITHUB_SHA::12}"

          SERVICES=(
            api-gateway
            auth-service
            restaurant-service
            order-service
            delivery-service
            customer-service
          )

          for SERVICE in "${SERVICES[@]}"; do

            if [ "$SERVICE" = "api-gateway" ]; then
              BUILD_CONTEXT="./api-gateway"
            else
              BUILD_CONTEXT="./services/$SERVICE"
            fi

            IMAGE_URI="$REGISTRY/$ECR_PREFIX/$SERVICE"

            echo "=================================="
            echo "Building: $SERVICE"
            echo "=================================="

            docker build \
              -t "$IMAGE_URI:$IMAGE_TAG" \
              -t "$IMAGE_URI:latest" \
              "$BUILD_CONTEXT"

            echo "Pushing versioned image..."
            docker push "$IMAGE_URI:$IMAGE_TAG"

            echo "Pushing latest image..."
            docker push "$IMAGE_URI:latest"

            echo "Successfully pushed $SERVICE"
          done

          echo "All six Docker images pushed!"

      # Step 8: Update ECS service (optional)
      - name: Deploy to Amazon ECS
        if: ${{ inputs.deploy_ecs == true }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking ECS service..."

          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].status" \
            --output text)

          if [ "$SERVICE_STATUS" != "ACTIVE" ]; then
            echo "::error::ECS service is not ACTIVE. Create the ECS cluster and service first."
            exit 1
          fi

          echo "Starting new ECS deployment..."

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

          echo "Waiting for ECS service to stabilize..."

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "ECS deployment completed!"

      # Step 9: Deployment summary
      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          echo "## AWS Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- AWS Account: $AWS_ACCOUNT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- AWS Region: $AWS_REGION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker Images: 6" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- ECS Deployment Requested: ${{ inputs.deploy_ecs }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All six images were pushed successfully." >> "$GITHUB_STEP_SUMMARY"
